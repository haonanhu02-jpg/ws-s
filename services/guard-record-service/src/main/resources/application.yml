server.port: ${SERVER_PORT:8083}
spring:
  application.name: guard-record-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/visitor_database?currentSchema=guard_schema}
    username: ${DB_USERNAME:visitor}
    password: ${DB_PASSWORD:visitor}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USERNAME:visitor}
    password: ${RABBITMQ_PASSWORD:visitor}
management.endpoints.web.exposure.include: health,info
visitor:
  security.jwt-secret: ${VISITOR_JWT_SECRET:visitor-jwt-development-secret-change-before-production}
  guard:
    visibility-mode: ${GUARD_VISIBILITY_MODE:UNDECIDED}
    registration-service-url: ${REGISTRATION_SERVICE_URL:http://localhost:8082}
    internal-token: ${VISITOR_INTERNAL_TOKEN:}
