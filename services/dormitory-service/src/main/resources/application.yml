server.port: ${SERVER_PORT:8084}
spring:
  application.name: dormitory-service
  servlet.multipart:
    max-file-size: 10MB
    max-request-size: 11MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/visitor_database?currentSchema=dormitory_schema}
    username: ${DB_USERNAME:visitor}
    password: ${DB_PASSWORD:visitor}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USERNAME:visitor}
    password: ${RABBITMQ_PASSWORD:visitor}
management.endpoints.web.exposure.include: health,info
visitor:
  security.jwt-secret: ${VISITOR_JWT_SECRET:visitor-jwt-development-secret-change-before-production}
  dormitory:
    scope-mode: ${DORMITORY_SCOPE_MODE:UNDECIDED}
    registration-service-url: ${REGISTRATION_SERVICE_URL:http://localhost:8082}
    internal-token: ${VISITOR_INTERNAL_TOKEN:}
    attachment-path: ${DORMITORY_ATTACHMENT_PATH:./data/dormitory-attachments}
