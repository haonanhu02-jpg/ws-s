server.port: ${SERVER_PORT:8085}
spring:
  application.name: oa-integration-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/visitor_database?currentSchema=oa_integration_schema}
    username: ${DB_USERNAME:visitor}
    password: ${DB_PASSWORD:visitor}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USERNAME:visitor}
    password: ${RABBITMQ_PASSWORD:visitor}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1000ms
          multiplier: 2
        default-requeue-rejected: false
management.endpoints.web.exposure.include: health,info
visitor:
  oa:
    registration-service-url: ${REGISTRATION_SERVICE_URL:http://localhost:8082}
    internal-token: ${VISITOR_INTERNAL_TOKEN:}
